name: WhoSudod

options:
  bundleIdPrefix: com.zats
  minimumXcodeGenVersion: "2.45.4"
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "27.0"

packages:
  Permiso:
    url: https://github.com/zats/permiso.git
    revision: 713c8b70c650947dd349754f3720287a7c2320d0

settings:
  base:
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 5KE88HWMKJ
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO
    MARKETING_VERSION: 1.1.0
    CURRENT_PROJECT_VERSION: 2

targets:
  WhoSudod:
    type: application
    platform: macOS
    productName: "Who Sudo'd"
    sources:
      - path: WhoSudod
      - path: WhoSudodPAMInstaller/com.zats.WhoSudo.PAMInstaller.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zats.WhoSudo
        PRODUCT_MODULE_NAME: WhoSudod
        PRODUCT_NAME: "Who Sudo'd"
        INFOPLIST_KEY_CFBundleDisplayName: "Who Sudo'd"
        INFOPLIST_KEY_CFBundleShortVersionString: "$(MARKETING_VERSION)"
        INFOPLIST_KEY_CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSSystemAdministrationUsageDescription: "Who Sudo'd installs or removes its optional sudo password input."
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - package: Permiso
      - target: WhoSudodPAMInstaller
        embed: true
        link: false
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Library/LaunchServices
      - target: WhoSudodPAM
        embed: true
        link: false
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Library/PAMModules
      - target: WhoSudodPAMTerminalReader
        embed: true
        link: false
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Library/PAMModules
    scheme:
      testTargets:
        - WhoSudodTests

  WhoSudodTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: WhoSudodTests
      - path: WhoSudodPAMInstaller/PAMManagedConfigurationGuard.swift
      - path: WhoSudodPAMInstaller/PAMMutationTransaction.swift
      - path: WhoSudodPAMInstaller/PAMOperationAuthorization.swift
      - path: WhoSudodPAMInstaller/PAMInstallerMutationAuthorizationGate.swift
      - path: WhoSudodPAMInstaller/PAMInstallerClientAuditSession.swift
    dependencies:
      - target: WhoSudod
      - sdk: libbsm.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zats.WhoSudodTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) PAM_HELPER_UNIT_TESTS"

  WhoSudodLiveRequester:
    type: application
    platform: macOS
    productName: WhoSudodLiveRequester
    sources:
      - path: WhoSudodLiveRequester
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zats.WhoSudodLiveRequester
        PRODUCT_NAME: WhoSudodLiveRequester
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: WhoSudodLiveRequester
        INFOPLIST_KEY_LSUIElement: NO

  WhoSudodPAMInstaller:
    type: tool
    platform: macOS
    productName: WhoSudodPAMInstaller
    sources:
      - path: WhoSudodPAMInstaller
        excludes:
          - "*.plist"
          - "WhoSudodPAMInstaller-Bridging-Header.h"
      - path: WhoSudod/PAMIntegrationProtocol.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zats.WhoSudo.PAMInstaller
        PRODUCT_NAME: WhoSudodPAMInstaller
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        INFOPLIST_KEY_NSSystemAdministrationUsageDescription: "Who Sudo'd installs or removes its optional sudo password input."
        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/WhoSudodPAMInstaller/WhoSudodPAMInstaller-Bridging-Header.h"
    dependencies:
      - sdk: libManagedConfigurationFiles.tbd
      - sdk: libbsm.tbd

  WhoSudodPAM:
    type: library.dynamic
    platform: macOS
    productName: pam_whosudod
    sources:
      - path: WhoSudodPAM
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zats.WhoSudo.PAM
        PRODUCT_NAME: pam_whosudod
        GENERATE_INFOPLIST_FILE: NO
        OTHER_CODE_SIGN_FLAGS: "--identifier com.zats.WhoSudo.PAM"
        EXECUTABLE_PREFIX: ""
        EXECUTABLE_EXTENSION: so
        MACH_O_TYPE: mh_bundle
        DYLIB_COMPATIBILITY_VERSION: ""
        DYLIB_CURRENT_VERSION: ""
        SKIP_INSTALL: YES
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        GCC_TREAT_WARNINGS_AS_ERRORS: YES
        WARNING_CFLAGS:
          - "-Wall"
          - "-Wextra"
    dependencies:
      - sdk: libpam.tbd
      - sdk: Security.framework
      - sdk: CoreFoundation.framework

  WhoSudodPAMTerminalReader:
    type: tool
    platform: macOS
    productName: whosudod-pam-terminal-reader
    sources:
      - path: WhoSudodPAMTerminalReader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zats.WhoSudo.PAMTerminalReader
        PRODUCT_NAME: whosudod-pam-terminal-reader
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        OTHER_CODE_SIGN_FLAGS: "--identifier com.zats.WhoSudo.PAMTerminalReader"
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/WhoSudodPAM"
        GCC_TREAT_WARNINGS_AS_ERRORS: YES
        WARNING_CFLAGS:
          - "-Wall"
          - "-Wextra"
